<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Hyperbee benchmark results</title>
        <link rel="stylesheet" href="./style.css"></link>
        <script src="./apexcharts.full.min.js"></script>
        <script type="module" src="index.js"></script>
    </head>
    <body>
        <h1>Hyperbee benchmarks</h1>
        <p id="loading">Loading&hellip;</div>
        <div id="loaded" style="display: none;">
            <details>
                <summary>Config</summary>
                <form id="config-form">
                    <section>
                        <h3>Runs</h3>
                        <div id="runs"></div>
                    </section>
                    <section>
                        <h3>Benchmarks</h3>
                        <div id="benchmarks"></div>
                    </section>
                    <button type="submit">Filter results</button>
                </form>
            </details>
            <details open>
                <summary>Results</summary>
                <p id="charts-loading">Loading&hellip;</p>
                <div id="charts"></div>
            </details>
        </div>
    </body>
</html>
